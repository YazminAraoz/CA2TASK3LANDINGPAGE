<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BAY WATCH - Job Board for Independent Garages</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card-dark: #1e293b;
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            
            --primary: #1e3a8a;
            --primary-accent: #2563eb;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;

            --mech-tom: #1e3a8a;
            --mech-paddy: #d97706;
            --mech-liam: #059669;
            --mech-sean: #7c3aed;
            --mech-connor: #0891b2;
            --mech-none: #94a3b8;

            --alert-red-bg: #fee2e2;
            --alert-red-border: #ef4444;
            --alert-red-text: #991b1b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* LANDING PAGE HEADER */
        .landing-header {
            background-color: var(--bg-dark);
            color: #fff;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            background: var(--primary-accent);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.1rem;
        }

        .brand-title h1 {
            font-size: 1.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .brand-title span {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 600;
            display: block;
        }

        /* HERO SECTION */
        .hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #fff;
            padding: 60px 20px;
            text-align: center;
        }

        .hero h2 {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 900;
            line-height: 1.15;
            margin-bottom: 16px;
        }

        .hero h2 span {
            color: #60a5fa;
        }

        .hero p {
            font-size: 1.15rem;
            color: #94a3b8;
            max-width: 650px;
            margin: 0 auto 32px auto;
        }

        .btn-cta {
            background: var(--primary-accent);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 900;
            padding: 18px 36px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
